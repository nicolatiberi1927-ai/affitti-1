<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Registrati - Affitti Brevi</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>
    <header class="site-header">
        <div class="container header-content">
            <a class="logo" href="index.html">
                Affitti Brevi
            </a>

            <nav class="main-navigation">
                <a href="index.html">Cerca</a>
                <a href="login.html">Accedi</a>
                <a href="registrazione.html">Registrati</a>
            </nav>
        </div>
    </header>

    <main class="auth-main">
        <section class="auth-card">
            <p class="eyebrow">Nuovo account</p>

            <h1>Registrati</h1>

            <p class="auth-description">
                Crea un account ospite per prenotare oppure
                un account host per pubblicare immobili.
            </p>

            <div
                id="message"
                class="message hidden"
                role="alert"
            ></div>

            <form id="registration-form" class="auth-form">
                <div class="form-field">
                    <label for="name">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="name"
                        maxlength="100"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-field">
                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        maxlength="190"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-field">
                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        minlength="8"
                        maxlength="72"
                        autocomplete="new-password"
                        required
                    >

                    <small class="field-help">
                        Almeno 8 caratteri.
                    </small>
                </div>

                <div class="form-field">
                    <label for="password-confirmation">
                        Ripeti la password
                    </label>

                    <input
                        type="password"
                        id="password-confirmation"
                        minlength="8"
                        maxlength="72"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="form-field">
                    <label for="role">
                        Tipo di account
                    </label>

                    <select id="role" required>
                        <option value="ospite">
                            Ospite: voglio prenotare
                        </option>

                        <option value="host">
                            Host: voglio pubblicare immobili
                        </option>
                    </select>
                </div>

                <button
                    type="submit"
                    class="primary-button full-width"
                >
                    Crea account
                </button>
            </form>

            <p class="auth-alternative">
                Hai già un account?
                <a href="login.html">
                    Accedi
                </a>
            </p>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>Progetto Gestione Affitti Brevi</p>
        </div>
    </footer>

    <script src="js/registrazione.js"></script>
</body>
</html>
