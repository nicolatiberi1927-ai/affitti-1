<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Dettaglio immobile - Affitti Brevi</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>
    <header class="site-header">
        <div class="container header-content">
            <a class="logo" href="index.html">
                Affitti Brevi
            </a>

            <nav class="main-navigation">
                <a href="index.html">Cerca</a>
                <a href="login.html">Accedi</a>
                <a href="registrazione.html">Registrati</a>
            </nav>
        </div>
    </header>

    <main class="detail-main">
        <div class="container">
            <a class="back-link" href="index.html">
                ← Torna alla ricerca
            </a>

            <div
                id="message"
                class="message hidden"
                role="alert"
            ></div>

            <div
                id="loading"
                class="loading"
                aria-live="polite"
            >
                Caricamento dell'alloggio...
            </div>

            <section
                id="property-detail"
                class="detail-layout hidden"
            >
                <article class="detail-card">
                    <div class="detail-cover">
                        <span id="property-initial">
                            A
                        </span>
                    </div>

                    <div class="detail-content">
                        <p
                            id="property-location"
                            class="property-location"
                        ></p>

                        <h1 id="property-title"></h1>

                        <p
                            id="property-address"
                            class="detail-address"
                        ></p>

                        <p
                            id="property-description"
                            class="detail-description"
                        ></p>

                        <div
                            id="property-features"
                            class="property-features"
                        ></div>

                        <section class="services-section">
                            <h2>Servizi disponibili</h2>

                            <div
                                id="property-services"
                                class="services-list"
                            ></div>
                        </section>

                        <section class="host-section">
                            <h2>Host</h2>

                            <p id="property-host"></p>
                        </section>
                    </div>
                </article>

                <aside class="booking-card">
                    <div class="booking-price">
                        <strong id="property-price">
                            0,00 €
                        </strong>

                        <span>per notte</span>
                    </div>

                    <h2>Prenota il soggiorno</h2>

                    <form id="booking-form">
                        <div class="form-field">
                            <label for="booking-arrival">
                                Data di arrivo
                            </label>

                            <input
                                type="date"
                                id="booking-arrival"
                                required
                            >
                        </div>

                        <div class="form-field">
                            <label for="booking-departure">
                                Data di partenza
                            </label>

                            <input
                                type="date"
                                id="booking-departure"
                                required
                            >
                        </div>

                        <div class="form-field">
                            <label for="booking-guests">
                                Numero di ospiti
                            </label>

                            <input
                                type="number"
                                id="booking-guests"
                                min="1"
                                required
                            >
                        </div>

                        <div
                            id="booking-summary"
                            class="booking-summary hidden"
                        >
                            <div>
                                <span>Notti</span>
                                <strong id="summary-nights">0</strong>
                            </div>

                            <div>
                                <span>Totale indicativo</span>
                                <strong id="summary-total">0,00 €</strong>
                            </div>
                        </div>

                        <button
                            type="submit"
                            class="primary-button full-width"
                        >
                            Prenota
                        </button>
                    </form>

                    <p class="booking-note">
                        Il totale definitivo viene calcolato dal server.
                    </p>

                    <div
                        id="booking-message"
                        class="message hidden"
                        role="alert"
                    ></div>
                </aside>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>
                Progetto Gestione Affitti Brevi
            </p>
        </div>
    </footer>

    <script src="js/dettaglio.js"></script>
</body>
</html>
